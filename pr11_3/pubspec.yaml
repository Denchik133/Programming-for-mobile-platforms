name: pr11_3
description: "Offline-first task manager for practical work 11 part 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: TaskRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
