
name: Deploy Flutter Web

on:
  push:
    branches:
      - master
    paths:
      - 'pr5/**'
      - '.github/workflows/deploy-pr5.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: pr5
        run: flutter pub get

      - name: Run tests
        working-directory: pr5
        run: flutter test

      - name: Build web
        working-directory: pr5
        run: flutter build web --base-href /Programming-for-mobile-platforms/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pr5/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
